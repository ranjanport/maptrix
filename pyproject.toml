[project]
name = "maptrix"
dynamic = ["version"]
description = "MapTrix - A Python implemnentation of Geo library for map data processing and computation, including geospatial calculations, map data manipulation, and spatial analysis tools."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aman Ranjan", email = "aman.ranjan@mapmyindia.com"}
]

dependencies = [
]

[tool.setuptools]
    package-dir = {"" = "src"}

[tool.setuptools.packages.find]
    where = ["src"]

[build-system]
    requires = ["setuptools", "wheel", "cython"]
    build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "cibuildwheel>=2.23.3",
    "cython>=3.2.4",
    "setuptools>=82.0.0",
]

[tool.setuptools.dynamic]
    version = {attr = "maptrix.__version__"}

[tool.cibuildwheel]
    build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
    skip = "pp*"

[tool.cibuildwheel.linux]
    manylinux-x86_64-image = "manylinux_2_28"
